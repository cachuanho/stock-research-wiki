<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台股與產業研究 LLM Wiki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<style>
  :root{
    --bg:#F8FAFC; --card:#FFFFFF; --ink:#0F172A; --muted:#64748B; --line:#E2E8F0;
    --accent:#2563EB; --accent-bg:#DBEAFE;
    --up-bg:#FEE2E2; --up:#DC2626; --down-bg:#DCFCE7; --down:#16A34A;
    --shadow:0 2px 8px rgba(0,0,0,0.06);
  }
  *{box-sizing:border-box}
  html{scroll-padding-top:72px}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    line-height:1.8;font-variant-numeric:tabular-nums}
  a{color:var(--accent)}
  a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
  .topbar{position:sticky;top:0;z-index:10;background:var(--ink);color:#fff}
  .topbar-inner{max-width:820px;margin:0 auto;padding:12px 20px;display:flex;
    align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .brand{color:#fff;text-decoration:none;font-weight:700;font-size:1.05rem}
  .topnav{display:flex;gap:4px;flex-wrap:wrap}
  .topnav a{color:#CBD5E1;text-decoration:none;font-size:.9rem;padding:4px 10px;border-radius:6px}
  .topnav a:hover{color:#fff}
  .topnav a[aria-current="page"]{background:rgba(255,255,255,.12);color:#fff}
  main{max-width:820px;margin:0 auto;padding:28px 20px 56px}
  .path{font-size:.8rem;color:var(--muted);margin:0 0 10px;word-break:break-all}
  .page-head{background:var(--card);border-radius:12px;box-shadow:var(--shadow);
    padding:24px 26px;margin-bottom:16px}
  .page-head h1{margin:0;font-size:1.8rem;line-height:1.35}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .chip{font-size:.8rem;padding:1px 10px;border-radius:999px;font-weight:500;
    background:var(--accent-bg);color:var(--accent);white-space:nowrap}
  .chip.type{background:#F1F5F9;color:var(--muted)}
  .chip.up{background:var(--up-bg);color:var(--up)}
  .chip.down{background:var(--down-bg);color:var(--down)}
  .dates{margin-top:10px;font-size:.85rem;color:var(--muted)}
  .content{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:8px 26px 24px}
  .content h1{font-size:1.6rem;line-height:1.35;margin:20px 0 8px}
  .content h2{font-size:1.15rem;margin:28px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .content h3{font-size:1rem;margin:20px 0 6px}
  .content ul,.content ol{padding-left:1.3em}
  .content li{margin-bottom:4px}
  .content li:has(> input[type=checkbox]){list-style:none;margin-left:-1.3em}
  .content input[type=checkbox]{accent-color:var(--accent);margin-right:6px}
  .content blockquote{margin:16px 0;padding:12px 16px;border-radius:8px;
    background:var(--down-bg);border:1px solid #86EFAC;color:#14532D}
  .content blockquote p{margin:0}
  .content code{background:#F1F5F9;padding:1px 6px;border-radius:4px;font-size:.9em}
  .content pre{background:#F1F5F9;padding:14px;border-radius:8px;overflow-x:auto}
  .content pre code{background:none;padding:0}
  .table-wrap{overflow-x:auto}
  .content table{border-collapse:collapse;width:100%;font-size:.92rem;margin:12px 0}
  .content th,.content td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
  .content th{background:#F8FAFC}
  .content hr{border:none;border-top:1px solid var(--line);margin:24px 0}
  .meta-muted{color:var(--muted);font-size:.85rem}
  .notice{color:var(--muted)}
  footer{max-width:820px;margin:0 auto;padding:0 20px 40px;font-size:.85rem;color:var(--muted)}
  @media (max-width:640px){
    .page-head,.content{padding-left:18px;padding-right:18px}
    .page-head h1{font-size:1.45rem}
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#/wiki/index.md">台股與產業研究 LLM Wiki</a>
    <nav class="topnav" aria-label="主要頁面">
      <a href="#/wiki/index.md">總目錄</a>
      <a href="#/wiki/overview.md">總覽</a>
      <a href="#/wiki/log.md">更新紀錄</a>
      <a href="#/AGENTS.md">規則 AGENTS.md</a>
    </nav>
  </div>
</header>
<main>
  <p class="path" id="path"></p>
  <section class="page-head" id="head" hidden></section>
  <article class="content" id="content"><p class="notice">載入中…</p></article>
</main>
<footer>本站為個人研究筆記，不構成任何投資建議。內容由 AI 依 AGENTS.md 規則維護。</footer>
<script>
const HOME = 'wiki/index.md';
const TYPE_LABEL = {source:'來源摘要', company:'個股', industry:'產業', concept:'概念',
  analysis:'分析', overview:'總覽', index:'目錄', log:'更新紀錄'};
const STANCE_CLASS = {'偏多':'up', '偏空':'down', '中性':''};
function parseFrontmatter(text){
  const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
  if(!m) return {meta:{}, body:text};
  const meta = {};
  m[1].split(/\r?\n/).forEach(line => {
    const i = line.indexOf(':');
    if(i < 0) return;
    const key = line.slice(0, i).trim();
    let val = line.slice(i + 1).replace(/\s+#.*$/, '').trim();
    if(/^\[.*\]$/.test(val)) val = val.slice(1, -1).split(',').map(s => s.trim()).filter(Boolean);
    meta[key] = val;
  });
  return {meta, body:text.slice(m[0].length)};
}
function resolvePath(href, current){
  const u = new URL(href, 'https://wiki.local/' + current);
  return decodeURIComponent(u.pathname.slice(1)) + u.hash;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function renderHead(meta){
  const head = document.getElementById('head');
  if(!meta.title){ head.hidden = true; return; }
  const chips = [];
  if(TYPE_LABEL[meta.type]) chips.push(`<span class="chip type">${TYPE_LABEL[meta.type]}</span>`);
  (Array.isArray(meta.tags) ? meta.tags : []).forEach(t => chips.push(`<span class="chip">${escapeHtml(t)}</span>`));
  if(meta.stance) chips.push(`<span class="chip ${STANCE_CLASS[meta.stance] || ''}">${escapeHtml(meta.stance)}</span>`);
  const dates = [];
  if(meta.created) dates.push('建立 ' + escapeHtml(meta.created));
  if(meta.updated) dates.push('更新 ' + escapeHtml(meta.updated));
  if(meta.sources) dates.push('引用來源 ' + escapeHtml(meta.sources) + ' 份');
  head.innerHTML = `<h1>${escapeHtml(meta.title)}</h1>` +
    (chips.length ? `<div class="chips">${chips.join('')}</div>` : '') +
    (dates.length ? `<div class="dates">${dates.join('，')}</div>` : '');
  head.hidden = false;
}
function decorate(container, current){
  container.querySelectorAll('a[href]').forEach(a => {
    const href = a.getAttribute('href');
    if(/^(https?:|mailto:)/.test(href)){ a.target = '_blank'; a.rel = 'noopener'; return; }
    if(href.startsWith('#')) return;
    const target = resolvePath(href, current);
    if(/\.md(#.*)?$/.test(target)) a.setAttribute('href', '#/' + target);
    else a.setAttribute('href', target);
  });
  container.querySelectorAll('li').forEach(li => {
    li.innerHTML = li.innerHTML
      .replace(/｜(偏多|偏空|中性)｜/g, (_, s) => ` <span class="chip ${STANCE_CLASS[s]}">${s}</span> `)
      .replace(/｜(更新 \d{4}-\d{2}-\d{2})/g, ' <span class="meta-muted">$1</span>');
  });
  container.querySelectorAll('table').forEach(t => {
    const wrap = document.createElement('div');
    wrap.className = 'table-wrap';
    t.replaceWith(wrap); wrap.appendChild(t);
  });
}
async function load(){
  const raw = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
  const [path, anchor] = (raw || HOME).split('#');
  const content = document.getElementById('content');
  document.getElementById('path').textContent = '檔案：' + path;
  document.querySelectorAll('.topnav a').forEach(a => {
    if(a.getAttribute('href') === '#/' + path) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  });
  try{
    const res = await fetch(path, {cache:'no-cache'});
    if(!res.ok) throw new Error(res.status);
    const {meta, body} = parseFrontmatter(await res.text());
    renderHead(meta);
    content.innerHTML = marked.parse(body);
    decorate(content, path);
    document.title = (meta.title || path) + '｜台股與產業研究 LLM Wiki';
    if(anchor){ const el = document.getElementById(anchor); if(el) el.scrollIntoView(); }
    else window.scrollTo(0, 0);
  }catch(e){
    document.getElementById('head').hidden = true;
    content.innerHTML = `<h1>找不到這個頁面</h1>
      <p>無法讀取 <code>${escapeHtml(path)}</code>。請確認檔案存在，並已加入 <a href="#/${HOME}">總目錄</a>。</p>
      <p class="notice">若是直接在電腦上雙擊開啟 index.html，瀏覽器會擋下讀取。請改在資料夾內執行 <code>python -m http.server</code>，再開啟 http://localhost:8000。</p>`;
  }
}
window.addEventListener('hashchange', load);
load();
</script>
</body>
</html>
